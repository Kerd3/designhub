# Full stack: PostgreSQL + Express API + static frontend (nginx).
#   docker compose up --build
# Web: http://localhost:8080   API: http://localhost:5000/api
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: designhub
      POSTGRES_USER: designhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-designhub-local-only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U designhub -d designhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 5000
      DB_DRIVER: postgres
      DATABASE_URL: postgres://designhub:${POSTGRES_PASSWORD:-designhub-local-only}@db:5432/designhub
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      ALLOW_DEMO_RESET: "true"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_DATA_SOURCE: api
        VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
